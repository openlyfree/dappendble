syntax = "proto3";

package models;

option go_package = "github.com/openlyfree/dappendble/internal/models";

message Entry {
  uint64 column_id = 1;
  uint64 row_id    = 2;
  bytes  payload   = 3;
}

message Schema {
  repeated Column columns = 1;
  repeated int64 offset = 2;
}

message Column {
  uint64 id = 1;
  string name = 2;
  ColumnType type = 3;
}

enum ColumnType {
  COLUMN_TYPE_BYTES = 0;
  COLUMN_TYPE_STRING = 1;
  COLUMN_TYPE_INTEGER = 2;
  COLUMN_TYPE_FLOAT = 3;
}